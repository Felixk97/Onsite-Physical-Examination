<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Screening Admin</title><style>*{box-sizing:border-box}body{margin:0;padding:20px 14px 40px;background:#f4f4f2;color:#1c2430;font-family:Calibri,'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.card{width:100%;max-width:380px;background:#4d4d4d;border-radius:20px;padding:20px;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.35)}
h1{font-size:1.5rem;margin:6px 0 4px;text-align:center}.sub{color:#6b6b6b;text-align:center;margin:0 0 16px;font-weight:700}
.row{display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 4px rgba(0,0,0,.15)}.row b{background:#8a8a8a;color:#1c2430;flex:0 0 38%;padding:12px;font-size:.9rem;display:flex;align-items:center}
.row input{flex:1;min-width:0;border:0;padding:12px;font-size:.95rem;font-weight:600;text-align:right;outline:0}.row input:focus{box-shadow:inset 0 0 0 2px #c1611f}
.btn{width:100%;padding:15px;border:0;border-radius:8px;background:#c1611f;color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:0 4px 0 #8f470f}
.btn.alt{background:#8a8a8a;box-shadow:none;font-size:.9rem;padding:11px}.disp{background:#a9cdd2;color:#1c2430;border-radius:10px;padding:14px;text-align:center;margin-bottom:10px}.disp .v{font-size:2.3rem;font-weight:800}
.pill{display:block;border-radius:10px;padding:12px;text-align:center;font-weight:700;margin-bottom:10px;background:#c9e2e5;color:#1c2430}
.under{background:#bcd6ee}.normal{background:#b7e3c9}.atrisk,.mid{background:#f3dba0}.obese1{background:#f0b98a}.obese2,.high{background:#e8a49a}.obese3{background:#d98f8f}
.msg{color:#ffb4a8;text-align:center;min-height:1.2em;margin:4px 0;font-weight:700}.small{font-size:.8rem;color:#e0e0e0}.hide{display:none!important}
.lang{position:fixed;top:8px;right:8px;background:#fff;border-radius:20px;padding:3px;display:flex;gap:2px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.lang button{border:0;background:0;padding:6px 9px;border-radius:16px;font-weight:700;font-size:.7rem;color:#6b6b6b;cursor:pointer}.lang button.on{background:#c1611f;color:#fff}
body{align-items:stretch;max-width:980px;margin:0 auto}.panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:.95rem}
.b{border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer;background:#c1611f;color:#fff}.b.g{background:#8a8a8a}.b.r{background:#a23b2e}
.co{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eee}.co:last-child{border:0}.co .n{flex:1;min-width:140px;font-weight:700;cursor:pointer}.co.sel .n{color:#c1611f}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:7px 9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f4f4f2}
.tag{padding:3px 9px;border-radius:12px;font-size:.75rem;font-weight:700;color:#1c2430}.mid{background:#f3dba0}.high{background:#e8a49a}
</style></head><body>
<h1 style="color:#1c2430">Screening Admin</h1>
<div class="panel hide" id="login"><div class="bar"><input type="password" id="code" placeholder="Admin code"><button class="b" id="loginBtn">Log in</button></div><div class="msg" id="lmsg" style="color:#a23b2e"></div></div>
<div id="app" class="hide">
 <div class="panel"><div class="bar"><input id="newCo" placeholder="New company name"><button class="b" id="addCo">Add company</button><button class="b g" id="refresh">Refresh</button><span id="stat" class="small" style="color:#6b6b6b"></span><button class="b g" id="expAll">Export all CSV</button></div></div>
 <div class="panel" id="cos"></div>
 <div class="panel hide" id="people"><div class="bar"><b id="pTitle" style="flex:1"></b><input id="q" placeholder="Search name"><button class="b g" id="closeP">Close &times;</button><button class="b" id="expCo">Export CSV</button></div><div class="bar" style="margin:10px 0"><span id="nlInfo" class="small" style="color:#444;flex:1;min-width:160px"></span><input type="file" id="nlFile" accept=".csv,.txt" class="hide"><button class="b g" id="nlUp">Upload namelist (CSV)</button><button class="b g" id="nlMiss">Not yet screened (CSV)</button><button class="b r" id="nlClear">Clear list</button></div>
 <div class="tw" id="tbl"></div></div>
</div>
<script>const classify=b=>b<18.5?{l:'Underweight',c:'under'}:b<23?{l:'Normal',c:'normal'}:b<27.5?{l:'Overweight',c:'atrisk'}:b<32.5?{l:'Obese I',c:'obese1'}:b<37.5?{l:'Obese II',c:'obese2'}:{l:'Obese III',c:'obese3'};
const classifyBP=(s,d)=>s>=180||d>=120?{l:'Hypertensive Crisis',c:'high'}:s>=140||d>=90?{l:'Stage 2 Hypertension',c:'high'}:s>=130||d>=80?{l:'Stage 1 Hypertension',c:'mid'}:s>=120&&d<80?{l:'Elevated BP',c:'mid'}:{l:'Normal BP',c:'normal'};
const bmiOf=(h,w)=>h&&w?w/((h/100)*(h/100)):null;
const $=id=>document.getElementById(id);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let CODE=sessionStorage.getItem('adm')||'',D={companies:[],records:[]},SEL=null;
async function api(action,body){const r=await fetch('/api?action='+action,{method:body?'POST':'GET',headers:{'x-admin-code':CODE,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
 if(r.status===401){sessionStorage.removeItem('adm');CODE='';gate(true);throw new Error('401')}return r.json()}
function gate(login){$('login').classList.toggle('hide',!login);$('app').classList.toggle('hide',login)}
let busy=false,again=false,LOADING=false,COUNTS={};const PEND={},GONE=new Set();
async function load(){if(busy){again=true;return}busy=true;$('stat').textContent='Updating...';
 try{const [c,rs]=await Promise.all([api('companies'),SEL?api('records',{company:SEL}):null]);
  D.companies=c.companies.filter(x=>!GONE.has(x.id));COUNTS=c.counts||{};Object.keys(PEND).forEach(id=>{if(c.companies.some(x=>x.id===id))delete PEND[id];else D.companies.push(PEND[id])});D.records=rs?rs.records:[];LOADING=false;gate(false);draw();$('stat').textContent='Updated '+new Date().toLocaleTimeString()}
 catch(e){$('stat').textContent='Update failed - will retry'}
 busy=false;if(again){again=false;load()}}
const norm=n=>String(n).toLowerCase().replace(/\s+/g,' ').trim();
function merged(list){const nb={};list.forEach(r=>{if(r.barcode){const k=r.company+'|'+norm(r.name);(nb[k]=nb[k]||new Set()).add(r.barcode)}});
 const key=r=>{let bc=r.barcode;if(!bc){const s=nb[r.company+'|'+norm(r.name)];if(s&&s.size===1)bc=[...s][0]}return r.company+'|'+(bc?'b:'+String(bc).toUpperCase():'n:'+norm(r.name))};
 const m=new Map();
 list.slice().sort((a,b)=>a.updated-b.updated).forEach(r=>{const k=key(r);let o=m.get(k);
  if(!o){o={company:r.company,name:r.name,ids:[],created:r.created,updated:r.updated};m.set(k,o)}
  o.ids.push(r.id);if(!o.barcode||r.barcode)o.name=r.name;if(r.barcode)o.barcode=r.barcode;if(r.lce)o.lce=r.lce;o.created=Math.min(o.created,r.created);o.updated=Math.max(o.updated,r.updated);
  if(r.age!=null)o.age=r.age;if(r.height!=null&&r.weight!=null){o.height=r.height;o.weight=r.weight}if(r.sys!=null&&r.dia!=null){o.sys=r.sys;o.dia=r.dia}});
 return [...m.values()]}
const NL={};
const bnorm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');
async function loadNL(cid){try{NL[cid]=(await api('namelist_get',{company:cid})).entries||[]}catch(e){NL[cid]=[]}const c=D.companies.find(x=>x.id===cid);if(c&&SEL===cid)people(c)}
function missing(cid){const rs=merged(D.records.filter(r=>r.company===cid)),bc=new Set(rs.filter(r=>r.barcode).map(r=>bnorm(r.barcode))),nm=new Set(rs.map(r=>norm(r.name)));
 return (NL[cid]||[]).filter(e=>!bc.has(bnorm(e.barcode))&&!nm.has(norm(e.name)))}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const d=t.split('\n')[0].includes('\t')?'\t':',';const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===d){r.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=ch}
 if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(c=>c.trim()))}
function csvFile(rows,name){const csv='\uFEFF'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function uploadNL(file){const c=D.companies.find(x=>x.id===SEL);if(!c||!file)return;
 const rows=parseCSV(await file.text());if(!rows.length)return alert('Empty file');
 const h=rows[0].map(x=>x.trim().toLowerCase());let ni=h.findIndex(x=>/name/.test(x)),bi=h.findIndex(x=>/bar\s*code/.test(x)),li=h.findIndex(x=>/lce/.test(x)),start=1;
 if(ni<0||bi<0){ni=0;bi=1;li=2;start=0}
 const entries=rows.slice(start).map(r=>({name:(r[ni]||'').trim(),barcode:(r[bi]||'').trim(),lce:li>=0?(r[li]||'').trim():''})).filter(e=>e.name&&e.barcode);
 const seen=new Set();const uniq=entries.filter(e=>{const k=bnorm(e.barcode);if(seen.has(k))return false;seen.add(k);return true});
 const dup=entries.length-uniq.length;
 if(!confirm('Upload '+uniq.length+' people to "'+c.name+'"'+(dup?' ('+dup+' duplicate barcodes skipped)':'')+'?\nThis replaces the existing namelist.'))return;
 await api('namelist_put',{company:c.id,entries:uniq});loadNL(c.id)}
const cnt=id=>COUNTS[id]||0;
const link=id=>location.origin+'/?c='+id;
const pad=n=>String(n).padStart(2,'0'),stamp=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function draw(){const box=$('cos');box.innerHTML=D.companies.length?'':'<div class="small" style="color:#6b6b6b">No companies yet.</div>';
 D.companies.sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{const d=document.createElement('div');d.className='co'+(SEL===c.id?' sel':'');
  d.innerHTML='<span class="n">'+(SEL===c.id?'\u25be ':'\u25b8 ')+esc(c.name)+' <span class="small" style="color:#6b6b6b">('+cnt(c.id)+' entries)</span></span>';
  const mk=(t,cls,fn)=>{const b=document.createElement('button');b.className='b '+cls;b.textContent=t;b.onclick=e=>{e.stopPropagation();fn()};d.appendChild(b)};
  mk('Copy link','g',async()=>{try{await navigator.clipboard.writeText(link(c.id));}catch(e){prompt('Link',link(c.id))}});
  mk(c.open===false?'Closed \u2013 reopen':'Open \u2013 close','g',async()=>{await api('company_put',{id:c.id,name:c.name,open:c.open===false});c.open=(c.open===false);draw();load()});
  mk('Delete','r',async()=>{if(confirm('Delete "'+c.name+'" and ALL its records?')){await api('company_del',{id:c.id});GONE.add(c.id);D.companies=D.companies.filter(x=>x.id!==c.id);if(SEL===c.id){SEL=null;D.records=[]}draw();load()}});
  d.querySelector('.n').onclick=()=>{if(SEL===c.id){SEL=null;D.records=[];draw();return}SEL=c.id;D.records=[];LOADING=true;draw();load();loadNL(c.id)};box.appendChild(d)});
 const c=D.companies.find(x=>x.id===SEL);$('people').classList.toggle('hide',!c);if(c)people(c)}
function people(c){if(LOADING){$('pTitle').textContent=c.name;$('tbl').innerHTML='<div class="small" style="color:#6b6b6b;padding:10px">Loading...</div>';return}$('pTitle').textContent=c.name;const nl=NL[c.id]||[];$('nlInfo').textContent=nl.length?'Namelist: '+nl.length+' \u00b7 Screened: '+(nl.length-missing(c.id).length)+' \u00b7 Not yet: '+missing(c.id).length:'No namelist uploaded - barcodes are recorded exactly as scanned';const q=$('q').value.trim().toLowerCase();
 const rs=merged(D.records.filter(r=>r.company===c.id)).filter(r=>!q||(r.name+' '+(r.barcode||'')).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
 let h='<table><tr><th>Name</th><th>Barcode</th><th>LCE</th><th>Age</th><th>Height</th><th>Weight</th><th>BMI</th><th>BMI status</th><th>BP</th><th>BP status</th><th>Updated</th><th>Entries</th><th></th></tr>';
 rs.forEach(r=>{const b=bmiOf(r.height,r.weight),bc=b?classify(b):null,pc=r.sys&&r.dia?classifyBP(r.sys,r.dia):null;
  h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.barcode??'')+'</td><td>'+esc(r.lce??'')+'</td><td>'+(r.age??'')+'</td><td>'+(r.height??'')+'</td><td>'+(r.weight??'')+'</td><td>'+(b?b.toFixed(2):'')+'</td><td>'+(bc?'<span class="tag '+bc.c+'">'+bc.l+'</span>':'')+'</td><td>'+(r.sys||r.dia?(r.sys||'?')+'/'+(r.dia||'?'):'')+'</td><td>'+(pc?'<span class="tag '+pc.c+'">'+pc.l+'</span>':'')+'</td><td>'+stamp(r.updated)+'</td><td>'+r.ids.length+'</td><td><button class="b r" data-id="'+r.ids.join(',')+'">\u00d7</button></td></tr>'});
 $('tbl').innerHTML=h+'</table>'+(rs.length?'':'<div class="small" style="color:#6b6b6b;padding:10px">No records.</div>');
 $('tbl').querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{const ids=b.dataset.id.split(',');if(confirm('Delete this person'+(ids.length>1?' and all '+ids.length+' entries':'')+'?')){for(const id of ids)await api('rec_del',{company:c.id,id});load()}})}
const csvEsc=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function exp(list,name){const cn=Object.fromEntries(D.companies.map(c=>[c.id,c.name]));
 const head=['No','Company','Name','Barcode','LCE No','Age','Height (cm)','Weight (kg)','BMI','BMI Status','Systolic (mmHg)','Diastolic (mmHg)','Blood Pressure','BP Status','Date'];
 const rows=merged(list).sort((a,b)=>(cn[a.company]||'').localeCompare(cn[b.company]||'')||a.created-b.created).map((r,i)=>{const b=bmiOf(r.height,r.weight);
  return [i+1,cn[r.company]||'',r.name,r.barcode??'',r.lce??'',r.age??'',r.height??'',r.weight??'',b?b.toFixed(2):'',b?classify(b).l:'',r.sys??'',r.dia??'',r.sys&&r.dia?r.sys+'/'+r.dia+' mmHg':'',r.sys&&r.dia?classifyBP(r.sys,r.dia).l:'',stamp(r.updated)]});
 if(!rows.length)return alert('No records');
 const csv='\uFEFF'+[head].concat(rows).map(r=>r.map(csvEsc).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
 a.download=(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'screening')+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove()}
$('loginBtn').onclick=()=>{CODE=$('code').value.trim();if(CODE){sessionStorage.setItem('adm',CODE);load()}};
$('code').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
$('addCo').onclick=async()=>{const n=$('newCo').value.trim();if(!n)return;$('addCo').disabled=true;
 try{const r=await api('company_put',{name:n});PEND[r.id]={id:r.id,name:n,open:true,created:Date.now()};D.companies.push(PEND[r.id]);COUNTS[r.id]=0;$('newCo').value='';draw();load()}catch(e){}
 $('addCo').disabled=false};
$('newCo').onkeydown=e=>{if(e.key==='Enter')$('addCo').click()};
$('nlUp').onclick=()=>$('nlFile').click();$('nlFile').onchange=async e=>{await uploadNL(e.target.files[0]);e.target.value=''};
$('nlMiss').onclick=()=>{const c=D.companies.find(x=>x.id===SEL);if(!c)return;const m=missing(c.id);if(!m.length)return alert('Everyone on the namelist has been screened (or no namelist).');csvFile([['Name','Barcode','LCE No']].concat(m.map(e=>[e.name,e.barcode,e.lce||''])),'not-yet-screened-'+new Date().toISOString().slice(0,10)+'.csv')};
$('nlClear').onclick=async()=>{const c=D.companies.find(x=>x.id===SEL);if(c&&confirm('Remove the namelist for "'+c.name+'"?')){await api('namelist_put',{company:c.id,entries:[]});loadNL(c.id)}};
$('refresh').onclick=()=>{load().then(()=>{if(SEL)loadNL(SEL)})};$('q').oninput=()=>{const c=D.companies.find(x=>x.id===SEL);if(c)people(c)};
$('expAll').onclick=async()=>{try{const a=await api('all');exp(a.records,'all-companies')}catch(e){}};
$('closeP').onclick=()=>{SEL=null;D.records=[];draw()};
setInterval(()=>{if(CODE&&!document.hidden)load()},10000);
document.addEventListener('visibilitychange',()=>{if(CODE&&!document.hidden)load()});
$('expCo').onclick=()=>{const c=D.companies.find(x=>x.id===SEL);if(c)exp(D.records.filter(r=>r.company===c.id),c.name)};
CODE?load():gate(true);
</script></body></html>
